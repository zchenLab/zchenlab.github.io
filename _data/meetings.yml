# Conference and Meetings photo page (/meetings-photos), linked from the Showcase page.
#
# To add your own photos:
#   1. Put the image files in assets/images/conferences/ (JPG or PNG; ~1600px wide is plenty).
#   2. Add them under an event below with a `src` path and a caption. Photos show as
#      landscape tiles; add `portrait: true` to a tall photo so the crop keeps the top (faces).
#   3. Add or remove events freely; newest first. `place` and `date` are optional.
#      The Showcase card shows a slideshow of every photo here, in this order.
intro: >-
  Snapshots from conferences, workshops, seminars and meetings.

