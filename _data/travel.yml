# Travel photo page (/travel), linked from the Showcase page.
#
# To add your own photos:
#   1. Put the image files in assets/images/travel/ (JPG or PNG; ~1600px wide is plenty).
#   2. Add them under a trip below with a `src` path and a caption. Add `wide: true`
#      to a landscape photo so it shows wider instead of being cropped to portrait.
#   3. Add or remove trips freely; newest first. The first trip's first photo
#      is also used as the cover on the Showcase page.
intro: >-
  A few snapshots from conferences, fieldwork and teaching trips over the years.

trips:
  - name: Samarkand
    place: Samarkand, Uzbekistan
    date: November 2025
    photos:
      - src: assets/images/travel/samarkand-2025-station.jpg
        caption: Nov 2025, Samarkand
      - src: assets/images/travel/samarkand-2025-statue.jpg
        caption: Nov 2025, Samarkand

  - name: Bali
    place: Bali, Indonesia
    date: July 2025
    photos:
      - src: assets/images/travel/bali-2025-sunset.jpg
        caption: July 2025, Bali
      - src: assets/images/travel/bali-2025-gate.jpg
        caption: July 2025, Bali
      - src: assets/images/travel/bali-2025-heart.jpg
        caption: July 2025, Bali

  - name: Hong Kong
    place: Hong Kong
    date: October 2023
    photos:
      - src: assets/images/travel/hong-kong-2023.jpg
        caption: October 2023, HKUST Hong Kong

  - name: Guizhou Miaozhai
    place: Guizhou, China
    date: June 2023
    photos:
      - src: assets/images/travel/guizhou-miaozhai-2023.jpg
        caption: June 22, 2023, Guizhou Miaozhai
        wide: true
