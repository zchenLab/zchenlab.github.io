# Travel photo page (/travel), linked from the Showcase page.
#
# To add your own photos:
#   1. Put the image files in assets/images/travel/ (JPG or PNG; ~1600px wide is plenty).
#   2. Add them under a trip below with a `src` path and a caption. Add `wide: true`
#      to a landscape photo so it shows wider instead of being cropped to portrait.
#   3. Add or remove trips freely; newest first. The first trip's first photo
#      is also used as the cover on the Showcase page.
intro: >-
  A few snapshots from conferences, fieldwork and teaching trips over the years.

